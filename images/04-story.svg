    <text x="1018" y="200" font-size="10" fill="#9a3412">重力小知识</text>
    <text x="1018" y="216" font-size="8" fill="#c2410c">看不见的大手</text>
    <text x="970" y="270" font-size="13" font-weight="700" fill="#111827">⑤ 总结收尾</text>
    <text x="970" y="292" font-size="11.5" fill="#6b7280">三条结论 + 右下角知识卡片，</text>
    <text x="970" y="310" font-size="11.5" fill="#6b7280">再留给家长三个讨论题。</text>
  </g>

  <rect x="48" y="354" width="1104" height="64" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="72" y="380" font-family="sans-serif" font-size="12.5" fill="#374151">完整对话、每幕的画面提示词、知识卡片文案与家长指南，见 FULL-EXAMPLE.md；把「重力」换成浮力就是新故事。</text>
  <text x="72" y="402" font-family="sans-serif" font-size="11.5" fill="#6b7280">上图是结构示意，不是 Wan2.7 生成的成品插图；真实成品图在飞书文档里。</text>
</svg>
