<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="动画角色与知识类型的匹配关系">
  <rect width="1200" height="470" fill="#ffffff"/>
  <text x="48" y="46" font-family="sans-serif" font-size="25" font-weight="700" fill="#111827">角色不是随便选的：按知识类型配</text>
  <text x="48" y="76" font-family="sans-serif" font-size="14" fill="#6b7280">同一句「讲重力」，给 4 岁和给 10 岁，角色、句式、深度都不同。下表是仓库里写死的默认匹配。</text>

  <g font-family="sans-serif">
    <rect x="48" y="104" width="352" height="94" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="68" y="132" font-size="15" font-weight="700" fill="#1e3a8a">擎天柱</text>
    <text x="68" y="156" font-size="12.5" fill="#1e40af">数学、逻辑、领导力</text>
    <text x="68" y="180" font-size="11.5" fill="#6b7280">睿智有条理，用解谜和任务带出知识</text>

    <rect x="424" y="104" width="352" height="94" rx="10" fill="#fefce8" stroke="#fde68a"/>
    <text x="444" y="132" font-size="15" font-weight="700" fill="#854d0e">大黄蜂</text>
    <text x="444" y="156" font-size="12.5" fill="#a16207">科学、自然、探索</text>
    <text x="444" y="180" font-size="11.5" fill="#6b7280">好奇心强，让「发现」本身变成情节</text>

    <rect x="800" y="104" width="352" height="94" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="820" y="132" font-size="15" font-weight="700" fill="#065f46">救护车</text>
    <text x="820" y="156" font-size="12.5" fill="#047857">健康、安全、急救</text>
    <text x="820" y="180" font-size="11.5" fill="#6b7280">细心耐心，擅长把「为什么」讲清楚</text>

    <rect x="48" y="214" width="352" height="94" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="68" y="242" font-size="15" font-weight="700" fill="#4c1d95">奥特曼</text>
    <text x="68" y="266" font-size="12.5" fill="#6d28d9">勇气、环保、宇宙</text>
    <text x="68" y="290" font-size="11.5" fill="#6b7280">温柔的英雄，用保护与责任带出主题</text>

    <rect x="424" y="214" width="352" height="94" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="444" y="242" font-size="15" font-weight="700" fill="#9a3412">汪汪队</text>
    <text x="444" y="266" font-size="12.5" fill="#c2410c">安全、团队合作、社区</text>
    <text x="444" y="290" font-size="11.5" fill="#6b7280">亲切爱行动，救援场景天然适合互动</text>

    <rect x="800" y="214" width="352" height="94" rx="10" fill="#ecfeff" stroke="#a5f3fc"/>
    <text x="820" y="242" font-size="15" font-weight="700" fill="#155e75">超级飞侠</text>
    <text x="820" y="266" font-size="12.5" fill="#0e7490">地理、文化、旅行</text>
    <text x="820" y="290" font-size="11.5" fill="#6b7280">环游世界，顺带介绍各地风土</text>
  </g>

  <rect x="48" y="330" width="1104" height="112" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="72" y="356" font-family="sans-serif" font-size="13" font-weight="700" fill="#111827">年龄分三档，难度跟着变</text>
  <text x="72" y="382" font-family="sans-serif" font-size="12.5" fill="#374151">4–6 岁：简单句、只讲「是什么」；7–9 岁：加上简单的「为什么」；10–12 岁：讲原理、应用与拓展。</text>
  <text x="72" y="406" font-family="sans-serif" font-size="12" fill="#374151">角色库里还有威震天、小猪佩奇；飞书案例里的沙和尚属于临时扩展，尚未写进角色库文档。</text>
  <text x="72" y="428" font-family="sans-serif" font-size="11.5" fill="#6b7280">对应文件：references/character-voices.md、references/requirements-gathering.md、references/story-templates.md</text>
</svg>
